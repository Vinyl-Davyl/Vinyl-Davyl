name: Latest blog post workflow

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Hashnode posts and update README
        env:
          HASHNODE_HOST: "vinyldavyl.hashnode.dev"
          FEED_URL: "https://vinyldavyl.hashnode.dev/rss.xml"
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p .tmp
          GOT_POSTS=0

          # ---------- 1. Hashnode GraphQL API (primary) ----------
          echo "::group::Trying Hashnode GraphQL API"
          cat > .tmp/query.json <<JSON
          {"query":"query { publication(host: \"${HASHNODE_HOST}\") { posts(first: 5) { edges { node { title slug } } } } }"}
          JSON

          HTTP_CODE=$(curl -sS -w "%{http_code}" --max-time 30 \
            -X POST https://gql.hashnode.com \
            -H "Content-Type: application/json" \
            --data @.tmp/query.json \
            -o .tmp/gql.json) || HTTP_CODE="000"

          echo "GraphQL HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Response body (first 500 chars):"
            head -c 500 .tmp/gql.json || true
            echo ""
          fi
          echo "::endgroup::"

          if [ "$HTTP_CODE" = "200" ]; then
            if python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          host = os.environ["HASHNODE_HOST"]
          raw = Path(".tmp/gql.json").read_text(encoding="utf-8")

          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print("GraphQL response was not valid JSON")
              sys.exit(1)

          pub = (data.get("data") or {}).get("publication")
          if not pub:
              print(f"No publication in response: {raw[:300]}")
              sys.exit(1)

          posts = [
              {
                  "title": e["node"]["title"].strip(),
                  "link": f"https://{host}/{e['node']['slug']}",
              }
              for e in pub["posts"]["edges"]
          ]

          if not posts:
              print("GraphQL returned zero posts")
              sys.exit(1)

          Path(".tmp/posts.json").write_text(json.dumps(posts), encoding="utf-8")
          print(f"GraphQL: parsed {len(posts)} posts")
          PY
            then
              GOT_POSTS=1
            fi
          fi

          # ---------- 2. RSS through a read-only proxy (fallback) ----------
          if [ "$GOT_POSTS" -eq 0 ]; then
            echo "::group::Falling back to RSS via proxy"
            PROXY_URL="https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['FEED_URL'],safe=''))")"
            echo "Proxy URL: $PROXY_URL"

            HTTP_CODE=$(curl -sS -L -w "%{http_code}" --max-time 45 \
              "$PROXY_URL" -o .tmp/feed.xml) || HTTP_CODE="000"

            echo "Proxy HTTP status: $HTTP_CODE"
            echo "::endgroup::"

            if [ "$HTTP_CODE" = "200" ]; then
              if python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import json, sys
          from pathlib import Path

          try:
              root = ET.parse(Path(".tmp/feed.xml")).getroot()
          except ET.ParseError as e:
              print(f"Could not parse feed: {e}")
              sys.exit(1)

          posts = []
          for item in root.findall("./channel/item")[:5]:
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").strip()
              if title and link:
                  posts.append({"title": title, "link": link})

          if not posts:
              print("No items found in feed")
              sys.exit(1)

          Path(".tmp/posts.json").write_text(json.dumps(posts), encoding="utf-8")
          print(f"RSS proxy: parsed {len(posts)} posts")
          PY
              then
                GOT_POSTS=1
              fi
            fi
          fi

          # ---------- 3. Bail out if nothing worked ----------
          if [ "$GOT_POSTS" -eq 0 ]; then
            echo "::error::Could not fetch posts from GraphQL or RSS proxy"
            exit 1
          fi

          # ---------- 4. Write README ----------
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          readme_path = Path("README.md")
          posts = json.loads(Path(".tmp/posts.json").read_text(encoding="utf-8"))

          lines = [f"- [{p['title'].lower()}]({p['link']})" for p in posts]

          start = "<!-- BLOG-POST-LIST:START -->"
          end = "<!-- BLOG-POST-LIST:END -->"
          block = f"{start}\n" + "\n".join(lines) + f"\n{end}"

          text = readme_path.read_text(encoding="utf-8")
          if start not in text or end not in text:
              raise SystemExit("README is missing BLOG-POST-LIST markers")

          before, _ = text.split(start, 1)
          _, after = text.split(end, 1)
          readme_path.write_text(before + block + after, encoding="utf-8")

          print(f"Updated README with {len(lines)} posts")
          PY

      - name: Commit & push README updates
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- README.md; then
            echo "No README changes to commit"
          else
            git add README.md
            git commit -m "chore: update latest blog posts"
            git push
          fi
